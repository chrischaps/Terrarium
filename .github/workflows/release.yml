# A release on each v* tag (#91): the jar packed as terrarium.love with
# SHA256SUMS beside it (scripts/package.sh), checked on Linux and Windows by
# everything selftest.yml checks and the long gates it leaves out (LONG=1,
# #112: eggs, floor, ranges and the month), run against the packed file itself
# rather than the checkout, then drafted as a release with both attached. Publishing
# by hand stays the gate. A tag with a hyphen (v0.1.0-frame.1) drafts a
# prerelease, so the frame can follow the jar before v0.1.0.
name: release

on:
  push:
    tags: ["v*"]
  # A trial run: packs and checks the game as a workflow artifact, and
  # drafts nothing. So does a PR that changes how the game is packed or
  # checked, so the release is known to work before a tag needs it
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/package.sh
      - tests/ci.sh
      - .github/workflows/release.yml

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: terrarium
          path: |
            dist/terrarium.love
            dist/SHA256SUMS
          if-no-files-found: error

  # The same bytes that will be released, unzipped from the artifact and
  # opened as a .love, through tests/ci.sh
  check:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ALSOFT_DRIVERS: "null" # OpenAL Soft's silent output; CI has no sound card
      GAME: dist/terrarium.love
      LONG: 1 # the long gates too: what ships passes them all (#112)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4 # for tests/ and the lint, which reads the source

      - uses: actions/download-artifact@v4
        with:
          name: terrarium
          path: dist

      - name: Check the download against SHA256SUMS
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Install LÖVE 11.5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri
          cd "$RUNNER_TEMP" # outside the checkout, or the lint reads LÖVE's own Lua
          curl -fsSL -o love.AppImage https://github.com/love2d/love/releases/download/11.5/love-11.5-x86_64.AppImage
          chmod +x love.AppImage && ./love.AppImage --appimage-extract > /dev/null
          echo "LOVE=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "WINDOW=xvfb-run -a" >> "$GITHUB_ENV"

      - name: Install LÖVE 11.5 (Windows)
        if: runner.os == 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o love.zip https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
          unzip -q love.zip
          echo "LOVE=$RUNNER_TEMP/love-11.5-win64/lovec.exe" >> "$GITHUB_ENV"

      - name: Self-test the packed game
        run: sh tests/ci.sh

      # The month's genes, day by day (#27): the first evidence of selection
      - name: Keep the month's genes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: month-${{ matrix.os }}
          path: |
            ~/.local/share/love/terrarium/month_*.csv
            ${{ env.APPDATA }}/LOVE/terrarium/month_*.csv
          if-no-files-found: warn

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: terrarium
          path: dist

      - name: Draft the release (notes are written by hand before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist && sha256sum -c SHA256SUMS
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$TAG" terrarium.love SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft $pre --title "Terrarium ${TAG#v}" --notes "Draft: notes to follow."
